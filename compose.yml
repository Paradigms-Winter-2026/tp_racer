services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      DB_HOST: db
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - .:/app
      - deps:/app/deps
      - build:/app/_build
    stdin_open: true
    tty: true

volumes:
  pgdata:
  deps:
  build:
